# The Android D8 dex merger needs more room than Gradle's default heap for the
# Compose + Media3 dependency graph. Keeping the worker count low also avoids
# several memory-heavy transforms running at the same time on developer Macs.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
# AGP 9.1 has not yet raised its recommendation beyond API 36, while the
# current Compose/Material3/Coil artifacts require API 37 for compilation.
android.suppressUnsupportedCompileSdk=37,37.0
# Kotlin/JS uses the locally installed Node/npm toolchain. This also keeps all
# dependency repositories under settings.gradle.kts control.
kotlin.js.yarn=false
