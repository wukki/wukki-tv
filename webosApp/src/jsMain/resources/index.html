<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Wukki TV</title>
    <link rel="stylesheet" href="styles.css">
    <script>if (typeof globalThis === "undefined") window.globalThis = window;</script>
</head>
<body>
<main>
    <header>
        <div><h1>Wukki TV</h1><span>webOS csatornalista</span></div>
        <small id="platform"></small>
    </header>
    <video id="player" playsinline></video>
    <section class="browser">
        <div class="source-panel">
            <label for="source-url">Hivatalos Wukki playlist</label>
            <input id="source-url" type="url" readonly tabindex="-1">
            <div class="buttons">
                <button id="load-playlist" type="button">Playlist frissítése</button>
            </div>
            <div class="diagnostics">
                <label for="diagnostic-url">Diagnosztikai stream URL</label>
                <input id="diagnostic-url" type="url" inputmode="url" autocomplete="off" placeholder="http://…/stream.m3u8">
                <button id="play-direct" type="button">Közvetlen lejátszás</button>
            </div>
        </div>
        <div class="channels-panel">
            <div class="channels-heading"><h2>Csatornák</h2><span id="channel-count"></span></div>
            <div class="channel-filters">
                <label class="visually-hidden" for="channel-search">Csatorna keresése</label>
                <input id="channel-search" type="search" autocomplete="off" placeholder="Keresés csatornanév szerint">
                <button id="category-filter" type="button">Kategória: Összes</button>
                <button id="clear-filters" type="button" disabled>Szűrés törlése</button>
            </div>
            <p id="channel-empty" class="channel-empty" hidden></p>
            <div id="channel-list" class="channel-list" role="list" aria-label="Szűrt csatornák"></div>
        </div>
    </section>
    <section class="playback-hud">
        <div><small>Most megy</small><strong id="now-playing"></strong></div>
        <span>Fel/Le: csatornaváltás · OK: vezérlők · Back: bezárás/vissza</span>
        <button id="stop" type="button">Leállítás</button>
    </section>
    <p id="status" role="status"></p>
</main>
<script src="wukki-tv-webos.js" onerror="this.onerror=null;var fallback=document.createElement('script');fallback.src='../../../build/dist/js/productionExecutable/wukki-tv-webos.js';document.body.appendChild(fallback)"></script>
</body>
</html>
